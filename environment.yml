name: parlerEnv
channels:
  - rapidsai
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - pytorch-cuda=12.1  # Compatible with CUDA 12.0+
  - cuml=24.02  # RAPIDS cuML for GPU-accelerated ML
  - cupy  # Required for cuML
  - beautifulsoup4
  - pip
  - numpy
  - pip:
    - sentence-transformers
    - bertopic
    - plotly  # Required for BERTopic visualizations
    - umap-learn  # For dimensionality reduction
    - hdbscan  # For clustering
    - scikit-learn  # Often needed for BERTopic